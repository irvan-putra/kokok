name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "versionName to release (e.g. 0.1.0); empty = build only"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: upload rendered UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders
          path: app/build/outputs/ui/*.png

  emulator:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: build debug APK
        run: |
          gradle assembleDebug --no-daemon
          pkill -f GradleDaemon || true
      - name: qemu runtime deps (ubuntu-26.04 image lacks libpulse)
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: OS-level alarm flow on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash tools/emulator_test.sh
      - name: upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            main.png
            after-sync.png
            after-cancel.png
            feed-scheduled.txt
            feed-canceled.txt
            ui0.xml
            ui1b.xml
            ringing.png
            ringing-after-snooze.png
            permission-denied.png
            after-reboot.png
            dumpsys-after-reboot.txt
            ui.xml
            ui2.xml
            ui3.xml
            ui4.xml

  release:
    runs-on: ubuntu-latest
    needs: test  # experimental releases gate on unit tests only; emulator flow evidence is independent
    permissions:
      contents: write  # create prerelease + upload APK asset
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != ''
    env:
      VERSION_NAME: ${{ github.event.inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: decode signing key
        run: |
          echo "${{ secrets.KOKOK_SIGNING_KEY_B64 }}" | base64 -d > /tmp/release.keystore
      - name: build signed release APK
        run: |
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KOKOK_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password="${{ secrets.KOKOK_KEY_PASSWORD }}"
          cp app/build/outputs/apk/release/app-release.apk "kokok-v${VERSION_NAME}.apk"
      - name: verify and hash
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "kokok-v${VERSION_NAME}.apk"
          sha256sum "kokok-v${VERSION_NAME}.apk" | tee sha256.txt
      - name: publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          prerelease: true
          files: kokok-v${{ env.VERSION_NAME }}.apk
          body_path: sha256.txt
