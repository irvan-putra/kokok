name: build

on:
  push:
    branches: [main, integration/pairing-icon-volume]
  workflow_dispatch:
    inputs:
      release_version:
        description: "versionName to release (e.g. 0.1.0); empty = build only"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow==12.3.0 tink
      - run: python tools/badge_icon.py --check
      - run: python -m unittest discover -s tools -p 'test_feed_write.py' -v
      - name: reproduce missing cold-start key registration without changing stored data
        run: |
          cp app/src/main/java/com/vanipy/kokok/Keys.kt /tmp/keys-fixed.kt
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/vanipy/kokok/Keys.kt')
          p.write_text(p.read_text().replace('        com.google.crypto.tink.hybrid.HybridConfig.register()\n', ''))
          PY
          if gradle testDebugUnitTest --tests '*KeysColdStartTest.firstCryptoActionExportsOnlyPublicKeyAndKeepsItAcrossReopen' --no-daemon --max-workers=1; then
            cp /tmp/keys-fixed.kt app/src/main/java/com/vanipy/kokok/Keys.kt
            echo 'Cold-start regression unexpectedly passed without registration'
            exit 1
          fi
          cp /tmp/keys-fixed.kt app/src/main/java/com/vanipy/kokok/Keys.kt
      - name: cold-start public-key regression in a fresh worker
        run: gradle testDebugUnitTest --tests '*KeysColdStartTest' --no-daemon --max-workers=1
      - name: unit tests
        run: gradle testDebugUnitTest --no-daemon --max-workers=1 --refresh-dependencies
      - name: upload rendered UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders
          path: app/build/outputs/ui/*.png

  emulator:
    # Phone-first experimental release requested by the owner. Existing runtime
    # evidence remains separate; do not delay release with another emulator round.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_version == ''
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: build debug APK
        run: |
          gradle assembleDebug --no-daemon --max-workers=1 --refresh-dependencies
          pkill -f GradleDaemon || true
      - name: qemu runtime deps (ubuntu-26.04 image lacks libpulse)
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: OS-level alarm flow on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash tools/emulator_test.sh
      - name: upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            emulator-logcat.txt
            final-ui.xml
            final-screen.png
            full-feed-scheduled.txt
            full-feed-canceled.txt
            main.png
            after-sync.png
            after-cancel.png
            feed-scheduled.txt
            feed-canceled.txt
            ui0.xml
            ui1b.xml
            ringing.png
            ringing-after-snooze.png
            permission-denied.png
            after-reboot.png
            dumpsys-after-reboot.txt
            ring-services.txt
            media-player-1.txt
            media-player-2.txt
            after-snooze-services.txt
            rering-services.txt
            after-dismiss-services.txt
            ui.xml
            ui2.xml
            ui3.xml
            ui4.xml
            uitap-fail.xml
            uitap-fail.png

  release:
    runs-on: ubuntu-latest
    needs: test  # Owner requested phone-first experimental validation, not another emulator round.
    permissions:
      contents: write  # create prerelease + upload APK asset
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != ''
    env:
      VERSION_NAME: ${{ github.event.inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow==12.3.0
      - name: decode signing key
        run: |
          echo "${{ secrets.KOKOK_SIGNING_KEY_B64 }}" | base64 -d > /tmp/release.keystore
      - name: build signed release APK
        run: |
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          python scripts/make_icons.py
          python tools/badge_icon.py --check
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KOKOK_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password="${{ secrets.KOKOK_KEY_PASSWORD }}"
          cp app/build/outputs/apk/release/app-release.apk "kokok-v${VERSION_NAME}.apk"
      - name: verify and hash
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "kokok-v${VERSION_NAME}.apk"
          sha256sum "kokok-v${VERSION_NAME}.apk" | tee sha256.txt
      - name: publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          prerelease: true
          files: kokok-v${{ env.VERSION_NAME }}.apk
          body: |
            Experimental phone-first build. Remote alarm delivery is not yet verified.
            Adds selectable public pairing-key text and copy fallback, initializes phone cryptography before first key access, and guards the optional share sheet.
            Existing alarm tone is unchanged. Device-specific loudness and remote alarm delivery remain unverified.
            Keep a backup alarm until the on-phone alarm list and actual ringing are verified.
            Install over the existing app without uninstalling or clearing data.
          append_body: true
