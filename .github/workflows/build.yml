name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "versionName to release (e.g. 0.1.0); empty = build only"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: upload rendered UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders
          path: app/build/outputs/ui/*.png

  emulator:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: build debug APK
        run: gradle assembleDebug --no-daemon
      - name: OS-level alarm flow on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.vanipy.kokok/.MainActivity
            sleep 5
            adb exec-out screencap -p > main.png
            adb shell dumpsys alarm | grep -A2 com.vanipy.kokok || true
            adb shell uiautomator dump /sdcard/ui.xml
            adb pull /sdcard/ui.xml ui.xml
            # tap "test alarm (rings in 60 s)" by label
            python3 - <<'PYEOF'
            import re, subprocess
            xml = open('ui.xml').read()
            m = re.search(r'text="test alarm \(rings in 60 s\)"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
            assert m, "test alarm button not found"
            x = (int(m.group(1)) + int(m.group(3))) // 2
            y = (int(m.group(2)) + int(m.group(4))) // 2
            subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)], check=True)
            PYEOF
            sleep 75
            adb exec-out screencap -p > ringing.png
            adb shell dumpsys notification | grep -B2 -A4 com.vanipy.kokok || true
            # dismiss via button if ringing UI is up
            adb shell uiautomator dump /sdcard/ui2.xml
            adb pull /sdcard/ui2.xml ui2.xml
            python3 - <<'PYEOF'
            import re, subprocess
            xml = open('ui2.xml').read()
            m = re.search(r'text="dismiss"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
            if m:
                x = (int(m.group(1)) + int(m.group(3))) // 2
                y = (int(m.group(2)) + int(m.group(4))) // 2
                subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)], check=True)
                print("dismissed")
            else:
                print("no dismiss button found")
            PYEOF
            sleep 3
            adb exec-out screencap -p > after-dismiss.png
      - name: upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            main.png
            ringing.png
            after-dismiss.png
            ui.xml
            ui2.xml

  release:
    runs-on: ubuntu-latest
    needs: emulator
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != ''
    env:
      VERSION_NAME: ${{ github.event.inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: decode signing key
        run: |
          echo "${{ secrets.KOKOK_SIGNING_KEY_B64 }}" | base64 -d > /tmp/release.keystore
      - name: build signed release APK
        run: |
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KOKOK_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password="${{ secrets.KOKOK_KEY_PASSWORD }}"
          cp app/build/outputs/apk/release/app-release.apk "kokok-v${VERSION_NAME}.apk"
      - name: verify and hash
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "kokok-v${VERSION_NAME}.apk"
          sha256sum "kokok-v${VERSION_NAME}.apk" | tee sha256.txt
      - name: publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          prerelease: true
          files: kokok-v${{ env.VERSION_NAME }}.apk
          body_path: sha256.txt
