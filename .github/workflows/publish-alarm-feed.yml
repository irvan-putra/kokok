name: publish encrypted alarm feed
on:
  workflow_dispatch:
    inputs:
      ciphertext:
        description: Already phone-encrypted canonical base64 only, never plaintext alarms
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: kokok-alarm-feed-writer
  cancel-in-progress: false
jobs:
  sign-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install tink==1.13.0
      - name: Sign and publish only encrypted payload
        env:
          KOKOK_PHONE_CIPHERTEXT: ${{ inputs.ciphertext }}
          KOKOK_FEED_SIGNING_KEY_B64: ${{ secrets.KOKOK_FEED_SIGNING_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_ciphertext.py
