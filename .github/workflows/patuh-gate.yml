name: patuh consistency gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@7da4a2e2b75b082518481bb587cc13f75a40e7b9
    with:
      app: kokok
      published: false
  verify-live-release:
    if: github.event_name == 'workflow_dispatch'
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@7da4a2e2b75b082518481bb587cc13f75a40e7b9
    with:
      app: kokok
      published: true
