name: patuh consistency gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@f05b5b148382a18661c616a76fd2d5ed9e6d88ba
    with:
      app: kokok
      published: false
  verify-live-release:
    if: github.event_name == 'workflow_dispatch'
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@f05b5b148382a18661c616a76fd2d5ed9e6d88ba
    with:
      app: kokok
      published: true
