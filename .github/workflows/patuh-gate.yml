name: patuh consistency gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@45bf9b340bc27f6bcafbe909204d5a717c072ab1
    with:
      app: kokok
      published: false
  verify-live-release:
    if: github.event_name == 'workflow_dispatch'
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@45bf9b340bc27f6bcafbe909204d5a717c072ab1
    with:
      app: kokok
      published: true
