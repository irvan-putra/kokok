name: patuh consistency gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@4e07bf7f13cf57ddbfa686908a707821387b9cf9
    with:
      app: kokok
      published: false
  verify-live-release:
    if: github.event_name == 'workflow_dispatch'
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@4e07bf7f13cf57ddbfa686908a707821387b9cf9
    with:
      app: kokok
      published: true
